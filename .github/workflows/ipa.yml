name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (for ExcalidrawWeb build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build ExcalidrawWeb bundle (into Resources)
        run: |
          cd ExcalidrawWeb
          npm ci
          npm run build:ios
          cd ..

      - name: XcodeGen (regenerate project for runner Xcode)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, regenerated project)
        run: |
          xcodebuild -quiet -project OpenCodeIOSClient.xcodeproj \
            -scheme OpenCodeIOSClient \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO build \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OpenCodeIOSClient.app Payload/
          zip -qr OpenClient.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClient-ipa
          path: OpenClient.ipa